<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QabyldauBot - Помощник абитуриента{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Character Avatar CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/character-avatar.css') }}">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bolashak-blue': '#1e40af',
                        'bolashak-light': '#3b82f6',
                        'bolashak-dark': '#1e3a8a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    {% block content %}{% endblock %}
    
    <!-- Character Avatar Scripts -->
    <script src="{{ url_for('static', filename='js/universal-widget-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/character-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/character-avatar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/character-integration.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
